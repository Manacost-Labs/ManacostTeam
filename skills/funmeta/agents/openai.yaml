interface:
  display_name: "Funmeta"
  short_description: "Необычные фан-колоды вне мета-таблиц по классам"
  default_prompt: "Используй $funmeta: ищи необычные колоды каждого класса через каталог, авторов, сообщества и актуальные карты; проверяй полный состав, механику и отличие от меты. Расскажи живо в стиле Манакоста и выведи проверенные коды, при необходимости восстановленные из точных опубликованных списков."
