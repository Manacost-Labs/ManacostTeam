# /etc/nginx/sites-available/studio.hearthpulse.net
# Studio (127.0.0.1:8796) за TLS. Сертификат — certbot webroot /var/www/letsencrypt.
# Порядок первого запуска описан в deploy/151/README.md: сначала только
# HTTP-блок, затем certbot, затем весь файл.

# Файл включается внутри http{}, поэтому map допустим; имя уникально, чтобы
# не столкнуться с map других сайтов.
map $http_upgrade $studio_connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.hearthpulse.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 предпочитает отдельную директиву `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.hearthpulse.net;

    ssl_certificate     /etc/letsencrypt/live/studio.hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:studio_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studio_connection_upgrade;

        # Длинные ответы модели и потоковая выдача (SSE).
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
