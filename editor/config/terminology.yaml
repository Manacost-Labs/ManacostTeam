# Единый источник терминологических решений.
# Каждое правило: что решено, на каком основании, с какой частотой в корпусе.
# Markdown-документы ссылаются сюда и не дублируют таблицы вручную.
version: 1
corpus:
  name: "гайды/"
  documents: 49
  words: 248157

rules:
  # aliases — другие написания той же сущности: англицизмы и кальки из отчётов
  # статистики. Строка ищется по леммам, {pattern: …} — по образцу
  - id: term.deck
    slang: дека
    aliases: [дэка]
    decision: advisory
    preferred: колода
    corpus: {slang: 56, preferred: 1854}
    note: "Корпус чаще использует «колода»; сохранять «дека», если это уместная авторская лексика. Частота не разрешает автоматическую замену."

  - id: term.stats
    slang: статы
    decision: advisory
    preferred: характеристики
    corpus: {slang: 15, preferred: 128}

  - id: term.setup
    slang: сетап
    decision: advisory
    preferred: подготовка
    corpus: {slang: 21, preferred: 99}

  - id: term.winrate
    slang: винрейт
    decision: allowed
    rejected_replacement: процент побед
    corpus: {slang: 68, rejected: 17}
    note: "Правило замены отменено: автор пишет наоборот"

  - id: term.lategame
    slang: лейтгейм
    decision: allowed
    rejected_replacement: поздняя игра
    corpus: {slang: 199, rejected: 8}

  - id: term.midgame
    slang: мидгейм
    decision: allowed
    rejected_replacement: середина игры
    corpus: {slang: 194, rejected: 15}

  - id: term.draw
    slang: добор
    decision: allowed
    rejected_replacement: взятие карт
    corpus: {slang: 243, rejected: 0}

  - id: term.ladder
    slang: ладдер
    decision: allowed
    rejected_replacement: рейтинговый режим
    corpus: {slang: 84, rejected: 0}

  - id: term.dust
    slang: пыль
    decision: allowed
    rejected_replacement: чародейская пыль
    corpus: {slang: 40, rejected: 0}
    note: "«Чародейской пыли» в корпусе нет; встречается «чародейной»"

  - id: term.aggro
    slang: агро
    decision: allowed
    alternative: агрессивный
    corpus: {slang: 437, alternative: 440}
    note: "Оба варианта авторские и в одних позициях — оставлять как написано"

  - id: term.minion
    slang: миньон
    decision: advisory
    preferred: существо
    corpus: {slang: 0, preferred: 870}
    note: "Отсутствие в корпусе не запрещает авторское слово; проверять контекст"

  - id: term.spell
    slang: спел
    decision: advisory
    preferred: заклинание
    corpus: {slang: 0, preferred: 1168}

  - id: term.build
    word: сборка
    decision: allowed
    corpus: {word: 769}
    note: "Не синоним колоды: колода — архетип, сборка — вариант листа"

  # ранги — по локализации: Бронза, Серебро, Золото, Платина, Алмаз, Легенда.
  # Английские брекеты статистики («Diamond-Legend», «Top Legend») в тексте
  # автора не появляются: «от Алмаза до Легенды», «в топе Легенды»
  - id: term.rank_diamond
    slang: Бриллиант
    aliases: [Diamond, даймонд, бриллиантовый]
    decision: auto_replace
    authority: language_norm
    preferred: Алмаз
    corpus: {slang: 0, preferred: 8}
    note: "Ранг Diamond в локализации — Алмаз; «на Алмазе и в Легенде», «до Алмаза»"

  - id: term.top_legend
    slang: Топ Легенда
    pattern: '\bТоп[\s-]+Легенд\w*'
    case_sensitive: true          # строчное «топ Легенды» — авторская форма, ловим только заглавный брекет
    aliases:
      - {pattern: '\bTop[\s-]+Legend\w*', shown: "Top Legend"}
      - {pattern: '\bтоп[\s-]+лег\w*', shown: "топ легенд (строчными)", case_sensitive: true}
    decision: auto_replace
    authority: language_norm
    preferred: топ Легенды
    corpus: {slang: 0, preferred: 5}
    note: "«в топе Легенды», «до топа Легенды» — строчными, в родительном падеже"

  - id: term.counterpick
    slang: контрпик
    aliases: [counterpick, counter-pick, каунтерпик, контр-пик]
    decision: advisory
    preferred: контра
    corpus: {slang: 0, preferred: 39}
    note: "«контра», «законтрить»; «контрпик» автор не пишет"

  - id: term.rank_segment
    slang: отрезок
    aliases: [брекет, bracket]
    decision: advisory
    preferred: ранг
    corpus: {slang: 0, preferred: 86}
    note: "О рангах — «на этих рангах», «на высоких рангах», не «на этом отрезке»"

  # замечания редактора к статьям 2026-11: сленг и кальки, которые он правил руками
  - id: term.milling
    slang: миллинг
    decision: advisory
    preferred: сжигание карт
    alternative: милл
    corpus: {slang: 0, preferred: 2}
    note: "«Миллинг» автор не пишет; «сжигание карт» или короткое «милл» по контексту"

  - id: term.win_condition
    slang: вин-кондишн
    pattern: '\bвин[\s-]?кондиш\w*'
    decision: auto_replace
    authority: language_norm
    preferred: способ победы
    alternative: условие победы
    corpus: {slang: 0, preferred: 153, alternative: 7}
    note: "«вин-кондишн», «винкондишен» — калька win condition; у автора «способ победы»"

  - id: term.raskrut
    slang: раскрут
    pattern: '\bраскрут(?:а|у|ом|е|ы|ов|ами|ах)?(?![а-яё])'
    decision: auto_replace
    authority: language_norm
    preferred: раскрутка
    alternative: перебор
    corpus: {slang: 0, preferred: 0, alternative: 42}
    note: "«раскрутка» колоды; о быстром доборе — «перебор». «Раскрутку», «раскрутить» не трогает"

  - id: term.scale_bg
    slang: скейл
    aliases:
      - {pattern: '\bскейл\w*', shown: "скейлится"}
    decision: advisory
    preferred: рост характеристик
    alternative: бафф
    corpus: {slang: 0, preferred: 1, alternative: 703}
    note: "О Полях сражений — «растёт», «набирает характеристики», «бафф», а не «скейлится»"

  - id: term.concentrate
    slang: сконцентрироваться
    decision: advisory
    preferred: сфокусироваться
    corpus: {slang: 5, preferred: 0}
    note: "Просьба редактора; в корпусе гайдов чаще «сконцентрироваться», поэтому подсказка, не замена"

  - id: term.naschet
    slang: на счет
    pattern: '\bна\s+сч[её]т\s+(?=(?:колод|карт|игр|сборк|матч|мет|геро|стратеги|заклинан|существ|тир|патч|баланс)\w*)'
    decision: advisory
    preferred: насчет
    corpus: {slang: 0, preferred: 0}
    note: "«На счет колоды/карт/игры» в значении «о» — «насчет»; «положить на счет» не трогать"

