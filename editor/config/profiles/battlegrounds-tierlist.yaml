id: battlegrounds-tierlist
title: Тир-лист Полей сражений
description: "Рейтинг пула Полей сражений: лучшие 1-е дропы, герои, аксессуары, существа тира. Разделы гайда одной стратегии не нужны"
min_words: 300
sections:
  # тир-лист не гайд по одной сборке: «Идея стратегии», «Ключевые существа» и
  # «План по ходам» в нём не обязательны, разделы — это ступени рейтинга
  required: []
  optional:
    - {id: changes, title: Изменения в сезоне, variants: [изменения в сезоне, что изменилось, изменения, что поменялось],
       purpose: "что поменялось в пуле или патче и как это сдвинуло рейтинг"}
    - {id: best, title: Лучшие, variants: [лучшие, лучшие существа, лучшие герои, лучшие аксессуары, топ],
       purpose: "кого брать при любой возможности и за счёт чего они сильнее остальных"}
    - {id: good, title: Хорошие, variants: [хорошие, хорошие существа, хорошие герои, хорошие аксессуары],
       purpose: "уверенный выбор, если лучших нет; в каком лобби и под какую стратегию"}
    - {id: decent, title: Неплохие, variants: [неплохие, средние, ситуативные, средние существа],
       purpose: "ситуативный выбор: когда он оправдан и когда лучше пропустить"}
    - {id: bad, title: Плохие, variants: [плохие, худшие, слабые, худшие существа, плохие существа],
       purpose: "кого не брать и почему, без пересказа текста карт"}
    - {id: conclusion, title: Вывод, variants: [вывод, заключение, итог, итоги],
       purpose: "главное для игрока одной-двумя фразами: на что смотреть в первую очередь"}
norms:
  provisional: true
  source: "нормы гайдов по колодам; одобренных тир-листов и статей в корпусе нет"
matchups: {require_classes: false}
analyzers: {markers: true, rhythm: true, soul: true, cards: true, structure: true, consistency: true, clarity: false}
weights: {живое: 0.30, ритм: 0.25, чистота: 0.15, названия: 0.10, согласованность: 0.10, структура: 0.10}
note: "Рейтинг пула по ступеням; список существ с жирными названиями — оглавление тира, а не приём «Ярлык: пояснение»"
# форма подачи: оглавление тира «- **Подозрительный надзиратель**» — это перечень
# карт, а не акцент; маркеры «Перебор жирного» и «Ярлык: пояснение» на таких
# пунктах не показываются (editorteam.rules.filter_marker_hits)
form:
  allow_bold_index_lists: true
# лексика — как у battlegrounds-article: пороги сняты с 37 статей corpus-bg
lexicon:
  extra_corpora: [corpus-bg]
  glossary: [battlegrounds]
  skip_unknown_cards: true
  warn_pct: 4.6
  fail_pct: 8.8
