name: Differential

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

jobs:
  differential:
    name: Compare with python-hsreplay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/differential/requirements.txt
      - run: pip install -r scripts/differential/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: compare
        run: PYTHON=python node scripts/differential/compare.mjs --report-dir differential
      - uses: actions/upload-artifact@v4
        if: always() && steps.compare.outcome != 'skipped'
        with:
          name: differential-report
          path: differential
          if-no-files-found: ignore
