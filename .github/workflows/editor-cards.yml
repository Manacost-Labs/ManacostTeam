name: Editor card snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: editor

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .claude/skills/hs-edit/scripts/update_cards.py
      - name: Validate snapshot
        run: python -c "import json; d=json.load(open('.claude/skills/hs-edit/assets/cards-ru.json', encoding='utf-8')); assert len(d['карты']) > 6000; print(d['_снято'], len(d['карты']))"
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- .claude/skills/hs-edit/assets/cards-ru.json; then
            echo "snapshot is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/hs-edit/assets/cards-ru.json
          git commit -m "chore(editor): refresh card snapshot $(date -u +%Y-%m-%d)"
          git push
