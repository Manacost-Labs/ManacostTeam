name: Editor card snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: editor

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .claude/skills/hs-edit/scripts/update_cards.py
      - name: Validate snapshot
        run: python -c "import json; d=json.load(open('.claude/skills/hs-edit/assets/cards-ru.json', encoding='utf-8')); assert len(d['карты']) > 6000; print(d['_снято'], len(d['карты']))"
      - name: Describe candidate
        run: |
          git diff --stat -- .claude/skills/hs-edit/assets/cards-ru.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate only: import this snapshot in a versioned EditorTeam release, then run packages checks. Published package bytes must remain immutable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate snapshot
        uses: actions/upload-artifact@v4
        with:
          name: editor-card-snapshot-candidate
          path: editor/.claude/skills/hs-edit/assets/cards-ru.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
