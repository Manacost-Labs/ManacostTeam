name: Translate CI

on:
  push:
    branches: [main]
    paths:
      - "translate/**"
      - ".github/workflows/translate-ci.yml"
  pull_request:
    paths:
      - "translate/**"
      - ".github/workflows/translate-ci.yml"

defaults:
  run:
    working-directory: translate

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests tools
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag translate-team:test .
