name: Editor CI

on:
  push:
    branches: [main]
    paths:
      - "editor/**"
      - ".github/workflows/editor-ci.yml"
  pull_request:
    paths:
      - "editor/**"
      - ".github/workflows/editor-ci.yml"

defaults:
  run:
    working-directory: editor

jobs:
  python:
    name: Python ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests .claude/skills
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: pytest -q
      - run: editor-team config validate
      - run: editor-team profiles

  corpus:
    name: Corpus regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: editor-team corpus validate
      - run: editor-team corpus split --format json
      - run: python .claude/skills/hs-edit/scripts/selftest.py

  go:
    name: Go service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: test -z "$(gofmt -l ./go)"
      - run: go vet ./...
        working-directory: editor/go
      - run: go test ./...
        working-directory: editor/go
      - run: go build ./...
        working-directory: editor/go

  nlp-sidecar:
    name: NLP sidecar / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r sidecars/nlp/requirements.lock
      - run: pip install pytest ruff
      - run: pytest -q test_server.py
        working-directory: editor/sidecars/nlp
      - run: ruff check server.py test_server.py
        working-directory: editor/sidecars/nlp
      - run: ruff format --check server.py test_server.py
        working-directory: editor/sidecars/nlp

  eval-contract:
    name: Promptfoo deterministic contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test evals/tests/evals.test.js
      - run: npx promptfoo validate -c evals/promptfooconfig.yaml
      - run: npx promptfoo validate -c evals/promptfooconfig.pipeline.yaml

  docker-toolchain:
    name: Docker toolchain and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target gateway-integration .
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target gateway .
      - run: docker build --target gateway --tag editorteam-gateway:test .
      - run: tests/integration/docker_toolchain.sh editorteam-gateway:test
      - run: docker compose config --quiet
      - name: Compose health path
        run: |
          docker compose build
          EDITOR_BIND_ADDRESS=127.0.0.1 docker compose up -d --wait
          curl --fail http://127.0.0.1:8740/health > /tmp/editorteam-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/editorteam-health.json").read_text())
          assert health["ok"] is True, health
          assert health["checks_complete"] is True, health
          assert all(state == "ok" for state in health["analyzers"].values()), health
          PY
          docker compose exec -T nlp python -c 'import json, urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8742/health")); assert h["ok"] and h["complete"], h'
          python tests/integration/nlp_sidecar_http.py
          curl --fail --silent --show-error -X POST http://127.0.0.1:8742/analyze \
            -H "Content-Type: application/json" \
            -d '{"text":"Игрок купил существо и усилил существ на столе.","language":"ru-RU","game":"hearthstone","profile":"guide"}' \
            > /tmp/editorteam-nlp-analyze.json
          docker compose down --volumes
      - name: Full pipeline E2E
        run: |
          EDITOR_BIND_ADDRESS=127.0.0.1 docker compose \
            -f docker-compose.yml -f tests/integration/docker-compose.e2e.yml \
            up -d --build --wait
          python tests/integration/pipeline_e2e.py
      - name: Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop Compose services
        if: always()
        run: |
          docker compose -f docker-compose.yml \
            -f tests/integration/docker-compose.e2e.yml \
            down --volumes --remove-orphans
